<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Team Mewpilot · Mission Control</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-badge">🐱</div>
    <div>
      <h1>Team Mewpilot Mission Control</h1>
      <p class="tagline">The scrappy task tracker behind the Copilot CLI hands-on lab.</p>
    </div>
  </header>

  <main>
    <form id="add-form" class="add-form">
      <input id="task-input" type="text" placeholder="What's next for the sprint?" autocomplete="off" />
      <button type="submit">Add task</button>
    </form>

    <section class="board">
      <div class="column" data-column="todo">
        <h2>In Progress <span class="count" id="todo-count">0</span></h2>
        <ul id="todo-list" class="task-list"></ul>
      </div>
      <div class="column" data-column="done">
        <h2>Shipped <span class="count" id="done-count">0</span></h2>
        <ul id="done-list" class="task-list"></ul>
      </div>
    </section>

    <p class="hint">
      Same data, two views — this UI and <code>node src/index.js list</code> both read/write <code>tasks.json</code>.
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
